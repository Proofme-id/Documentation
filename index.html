<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Proofme documentation</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <link rel="icon" href="/media/favicon.ico" />
        <meta name="description" content="Description">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
        <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/lib/themes/vue.css">
        <link rel="stylesheet" href="styles.css">
        <!-- $docsify.themeColor is deprecated as of docsify v5; the CSS custom property is
             the v5-supported replacement. -->
        <style>
            :root {
                --theme-color: #1B89C4;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script>
            window.$docsify = {
                repo: 'https://github.com/Proofme-id/Documentation',
                auto2top: true,
                coverpage: false,
                loadSidebar: true,
                // Only /_sidebar.md exists (a single, site-wide nav) — without this, docsify
                // tries a per-directory _sidebar.md first on every nested page (e.g.
                // /api/v1/document/_sidebar.md) and 404s before falling back to the root
                // one. This alias redirects every such lookup straight to the root file, so
                // the 404 never happens instead of happening-then-being-recovered-from.
                alias: {
                    '/.*/_sidebar\\.md': '/_sidebar.md'
                },
                search: 'auto',
                timeUpdater: {
                    text: "---\nlast update: {docsify-updated}",
                    formatUpdated: "{DD}/{MM}/{YYYY} {HH}:{mm}",
                },
                markdown: {
                    renderer: {

                        code: function (code, lang) {
                            if (lang === 'drawio') {
                                if (window.drawioConverter) {
                                    console.log('drawio')
                                    return window.drawioConverter(code)
                                } else {
                                    return `<div class='drawio-code'>${code}</div>`
                                }
                            } else {
                                return this.origin.code.apply(this, arguments);
                            }
                        }
                    }
                }
            }
        </script>
        <!-- Docsify v5 -->
        <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
        <!-- Vendored, patched copy — see vendor/docsify-websequencediagrams.js's header for
             why: the unpkg-hosted 2.0.1 build breaks under docsify v5's code-fence output. -->
        <script src="/vendor/docsify-websequencediagrams.js"></script>
        <!-- Emoji support has been built into docsify core since v4.13 — the separate
             plugin script is deprecated (and its own console warning confirms it), so it's
             not loaded here. -->
        <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-drawio/viewer.min.js"></script>
        <script src='//cdn.jsdelivr.net/npm/docsify-drawio/drawio.js'></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-updated@1/src/time-updater.min.js"></script>
    </body>
</html>
