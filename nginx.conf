server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # docsify uses hash-based routing (#/page) by default — this site does not set
    # routerMode: 'history', so every real HTTP request already maps to an actual file
    # (index.html, or a .md/asset docsify fetches by relative path). No SPA fallback
    # rewrite is needed here, unlike a path-routed Angular app.

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # index.html and the docsify navigation/config files must always be revalidated —
    # unlike Angular's content-hashed bundles, a docs edit needs to show up immediately.
    location ~ ^/(index\.html)?$ {
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }

    location ~ ^/(_sidebar\.md|_coverpage\.md)$ {
        default_type 'text/markdown; charset=utf-8';
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        include /etc/nginx/security-headers.conf;
    }

    # Markdown content and media — short cache, content isn't filename-hashed so a
    # long/aggressive cache would hide edits.
    location ~ \.md$ {
        default_type 'text/markdown; charset=utf-8';
        add_header Cache-Control 'max-age=600';
        include /etc/nginx/security-headers.conf;
    }

    location ~ \.(css|js)$ {
        add_header Cache-Control 'max-age=600';
        include /etc/nginx/security-headers.conf;
    }

    location / {
        add_header Cache-Control 'max-age=600';
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
