# Tailored to what index.html actually loads: docsify core/plugins from cdn.jsdelivr.net
# and unpkg.com (see index.html's <script>/<link> tags). Update this list if a script or
# stylesheet is added from a different CDN — a too-strict CSP fails silently in the
# browser console, not as a build/deploy error.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com; base-uri 'self'" always;
