# No Content-Security-Policy here — deliberately. This was tried (scoped to the CDN
# origins visible in index.html's <script>/<link> tags: cdn.jsdelivr.net, unpkg.com) and
# broke the live site twice after real Coolify deploys: docsify-drawio's viewer loads
# MathJax from app.diagrams.net, and (indirectly, from that same plugin) a Google Fonts
# stylesheet from fonts.googleapis.com — neither visible from a static read of index.html,
# since they're fetched dynamically by the plugin's own JS, not declared as <script> tags.
# A CSP fails *silently* (blank content, broken plugin) with no build/deploy-time error, so
# each miss only surfaces after a real browser check. Given docsify itself already requires
# 'unsafe-inline'/'unsafe-eval' for a CSP to not break the page outright, a policy strict
# enough to matter isn't really achievable here without a browser to iterate against — not
# worth the risk of a third repeat. If revisiting this, test every page/plugin (drawio,
# tabs, search, emoji) in a real browser console before deploying.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
